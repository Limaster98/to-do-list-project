<div class="border border-primary rounded-3 overflow-hidden w-100 px-2 mb-4">
    <table class="table mb-2">
        <thead>
            <tr>
                <th>
                    {{ title }}:
                </th>
            </tr>
        </thead>
        <tbody class="table-group-divider">
            {% if tasks %}
            {% for task in tasks %}
            <tr>
                <th class="ps-5">
                    - {{ task.description }}
                    <div class="float-end d-inline-flex align-items-center">
                        {% if type_task == 0 %}
                            <a class="text-decoration-none text-success mx-2"
                            href="{{ url_for('dashboard.update_task', task_id=task.id, new_type_task=1) }}">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-down" viewBox="0 0 16 16">
                                <path fill-rule="evenodd" d="M8 1a.5.5 0 0 1 .5.5v11.793l3.146-3.147a.5.5 0 0 1 .708.708l-4 4a.5.5 0 0 1-.708 0l-4-4a.5.5 0 0 1 .708-.708L7.5 13.293V1.5A.5.5 0 0 1 8 1"/>
                                </svg>
                            Iniciar</a>
                        {% elif type_task == 1 %}
                            <a class="text-decoration-none text-success mx-2"
                                href="{{ url_for('dashboard.update_task', task_id=task.id, new_type_task=2) }}">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-down" viewBox="0 0 16 16">
                                <path fill-rule="evenodd" d="M8 1a.5.5 0 0 1 .5.5v11.793l3.146-3.147a.5.5 0 0 1 .708.708l-4 4a.5.5 0 0 1-.708 0l-4-4a.5.5 0 0 1 .708-.708L7.5 13.293V1.5A.5.5 0 0 1 8 1"/>
                                </svg>
                            Concluir</a>
                            <a class="text-decoration-none text-success mx-2"
                                href="{{ url_for('dashboard.update_task', task_id=task.id, new_type_task=0) }}">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-up" viewBox="0 0 16 16">
                                <path fill-rule="evenodd" d="M8 15a.5.5 0 0 0 .5-.5V2.707l3.146 3.147a.5.5 0 0 0 .708-.708l-4-4a.5.5 0 0 0-.708 0l-4 4a.5.5 0 1 0 .708.708L7.5 2.707V14.5a.5.5 0 0 0 .5.5"/>
                                </svg>
                            Retornar</a>
                        {% else %}
                            <a class="text-decoration-none text-success mx-2"
                            href="{{ url_for('dashboard.update_task', task_id=task.id, new_type_task=1) }}">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-up" viewBox="0 0 16 16">
                                <path fill-rule="evenodd" d="M8 15a.5.5 0 0 0 .5-.5V2.707l3.146 3.147a.5.5 0 0 0 .708-.708l-4-4a.5.5 0 0 0-.708 0l-4 4a.5.5 0 1 0 .708.708L7.5 2.707V14.5a.5.5 0 0 0 .5.5"/>
                                </svg>
                            Retornar</a>
                        {% endif %}
                        <a class="mx-2" href="{{ url_for('dashboard.edit_task', task_id=task.id) }}">
                            <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" fill="currentColor" class="bi bi-pencil-square" viewBox="0 0 16 16">
                                <path d="M15.502 1.94a.5.5 0 0 1 0 .706L14.459 3.69l-2-2L13.502.646a.5.5 0 0 1 .707 0l1.293 1.293zm-1.75 2.456-2-2L4.939 9.21a.5.5 0 0 0-.121.196l-.805 2.414a.25.25 0 0 0 .316.316l2.414-.805a.5.5 0 0 0 .196-.12l6.813-6.814z"/>
                                <path fill-rule="evenodd" d="M1 13.5A1.5 1.5 0 0 0 2.5 15h11a1.5 1.5 0 0 0 1.5-1.5v-6a.5.5 0 0 0-1 0v6a.5.5 0 0 1-.5.5h-11a.5.5 0 0 1-.5-.5v-11a.5.5 0 0 1 .5-.5H9a.5.5 0 0 0 0-1H2.5A1.5 1.5 0 0 0 1 2.5z"/>
                            </svg></a>
                        <form action="{{ url_for('dashboard.delete_task', task_id=task.id) }}" method="POST"
                            class="d-inline mx-2">
                            <button type="submit"
                                class="btn btn-link p-0 text-danger text-decoration-none fw-bold border-0"
                                onclick="return confirm('Excluir esta tarefa?')">
                                X</button>
                        </form>
                    </div>
                </th>
            </tr>
            {% endfor %}
            {% endif %}
            <tr>
                <th class="ps-5" style="border: none;">
                    <a href="{{ url_for('dashboard.add_task', type_task=type_task) }}"><button type="submit"
                            class="btn btn-success btn-sm mt-2">Adicionar tarefa</button></a>
                </th>
            </tr>
        </tbody>
    </table>
</div>
