<div class="border border-primary rounded-3 overflow-hidden w-100 px-2 mb-4">
    <table class="table mb-2">
        <thead>
            <tr>
                <th>
                    {{ title }}:
                </th>
            </tr>
        </thead>
        <tbody class="table-group-divider">
            {% if tasks %}
            {% for task in tasks %}
            <tr>
                <th class="ps-5">
                    - {{ task.description }}
                    <div class="float-end d-inline-flex align-items-center">
                        <a class="text-decoration-none text-primary me-3"
                            href="{{ url_for('dashboard.edit_task', task_id=task.id) }}">Editar</a>
                        <form action="{{ url_for('dashboard.delete_task', task_id=task.id) }}" method="POST"
                            class="d-inline">
                            <button type="submit"
                                class="btn btn-link p-0 text-danger text-decoration-none fw-bold border-0"
                                onclick="return confirm('Excluir esta tarefa?')">
                                Excluir</button>
                        </form>
                    </div>
                </th>
            </tr>
            {% endfor %}
            {% endif %}
            <tr>
                <th class="ps-5" style="border: none;">
                    <a href="{{ url_for('dashboard.add_task', type_task=type_task) }}"><button type="submit"
                            class="btn btn-success btn-sm mt-2">Adicionar tarefa</button></a>
                </th>
            </tr>
        </tbody>
    </table>
</div>
