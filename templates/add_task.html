{% extends 'base.html' %}

{% block title %}
<title>To-do-list Adicionar tarefa</title>
{% endblock %}

{% block content %}
  <div>
    <h1 class="text-center">Insira sua tarefa !</h1>
    <form style="width: 65%;" class="mx-auto" method="POST">
        <label class="form-label" for="nome">Descrição da tarefa:</label>
        <input class="form-control" type="text" name="description"/>

        <div class="form-check mb-1 mt-2">
            <input class="form-check-input" type="radio" name="status" id="todo" value="todo" checked/>
            <label class="form-check-label" for="todo">A fazer</label>
        </div>
        
        <div class="form-check my-1">
            <input class="form-check-input" type="radio" name="status" id="progress" value="progress"/>
            <label class="form-check-label" for="progress">Em progresso</label>
        </div>

        <div class="form-check my-1">
            <input class="form-check-input" type="radio" name="status" id="complete" value="complete"/>
            <label class="form-check-label" for="complete">Concluída</label>
        </div>
        <div class="d-flex justify-content-center mt-2">
            <button class="btn btn-primary btn-lg" type="submit">Inserir tarefa</button>
        </div>
    </form>
  </div>
{% endblock %}
